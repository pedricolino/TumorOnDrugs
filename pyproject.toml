[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-on-drugs"
version = "0.1.0"
description = "Single-cell analysis and visualization helpers for tumor-on-drugs studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.13",
]

[project.optional-dependencies]
scanpy = ["scanpy>=1.9", "h5py>=3.8"]
gene-lookup = ["mygene>=3.2"]
progress = ["tqdm>=4.65"]
stabilized-ica = ["stabilized-ica>=2.0", "tqdm>=4.65"]
all = [
    "scanpy>=1.9",
    "h5py>=3.8",
    "mygene>=3.2",
    "stabilized-ica>=2.0",
    "tqdm>=4.65",
]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tumor_on_drugs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]